name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Build APK
        run: gradle -p extracted/AlSarhAccounts assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AlSarh-Accounts-APK
          path: extracted/AlSarhAccounts/app/build/outputs/apk/debug/app-debug.apk
